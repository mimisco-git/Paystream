<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>PayStream — Reset Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Cantarell:wght@400;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    :root{--slate:#0F1117;--slate2:#1A1D27;--amber:#C87A10;--amber-lt:#E8931A;--green:#10B981;--red:#FF4D6A;--white:#fff;--g2:#6B7A99;--g3:#2E3650;--border:rgba(255,255,255,0.07);--ff:'Cantarell',sans-serif;--ff-body:'DM Sans',sans-serif}
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--slate);color:var(--white);font-family:var(--ff-body);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .card{background:var(--slate2);border:.5px solid var(--border);border-radius:22px;padding:36px;width:100%;max-width:420px;position:relative;overflow:hidden}
    .card::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:50%;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent)}
    .logo{font-family:var(--ff);font-weight:700;font-size:22px;text-align:center;margin-bottom:24px}<span style="color:var(--amber)">Pay</span>Stream
    h2{font-family:var(--ff);font-weight:700;font-size:22px;margin-bottom:6px;text-align:center}
    .sub{font-size:13px;color:var(--g2);text-align:center;margin-bottom:28px;line-height:1.5}
    label{font-size:11px;font-weight:600;color:var(--g2);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px}
    input{width:100%;background:#151820;border:.5px solid var(--border);border-radius:9px;padding:12px 14px;font-size:14px;color:var(--white);font-family:var(--ff-body);outline:none;margin-bottom:14px;transition:border-color .2s}
    input:focus{border-color:rgba(200,122,16,.4)}
    .btn{width:100%;background:linear-gradient(135deg,var(--amber),var(--amber-lt));color:#000;font-family:var(--ff-body);font-weight:700;font-size:14px;padding:13px;border-radius:9px;border:none;cursor:pointer;transition:opacity .2s}
    .btn:hover{opacity:.88}
    .msg{text-align:center;font-size:13px;margin-top:14px;padding:10px;border-radius:8px;display:none}
    .msg.success{background:rgba(16,185,129,.1);color:var(--green);border:.5px solid rgba(16,185,129,.2)}
    .msg.error{background:rgba(255,77,106,.1);color:var(--red);border:.5px solid rgba(255,77,106,.2)}
    .back{text-align:center;margin-top:18px;font-size:13px;color:var(--g2)}.back a{color:var(--amber);text-decoration:none}
  </style>
</head>
<body>
<div class="card">
  <div class="logo"><span style="color:var(--amber)">Pay</span>Stream</div>
  <!-- FORGOT PASSWORD FORM -->
  <div id="forgot-form">
    <h2>Forgot password</h2>
    <p class="sub">Enter your email and we will send you a reset link.</p>
    <label>Email address</label>
    <input id="forgot-email" type="email" placeholder="you@example.com" onkeydown="if(event.key==='Enter')sendReset()"/>
    <button class="btn" onclick="sendReset()">Send reset link</button>
    <div class="msg" id="forgot-msg"></div>
    <div class="back"><a href="login.html">Back to sign in</a></div>
  </div>
  <!-- RESET PASSWORD FORM -->
  <div id="reset-form" style="display:none">
    <h2>Set new password</h2>
    <p class="sub">Enter your new password below.</p>
    <label>New password</label>
    <input id="new-password" type="password" placeholder="At least 6 characters" onkeydown="if(event.key==='Enter')doReset()"/>
    <label>Confirm password</label>
    <input id="confirm-password" type="password" placeholder="Repeat password" onkeydown="if(event.key==='Enter')doReset()"/>
    <button class="btn" onclick="doReset()">Reset password</button>
    <div class="msg" id="reset-msg"></div>
  </div>
</div>

<script>
const API = 'https://paystream-9xtb.onrender.com'
const params = new URLSearchParams(window.location.search)
const token  = params.get('token')

// If token in URL show reset form
if (token) {
  document.getElementById('forgot-form').style.display = 'none'
  document.getElementById('reset-form').style.display  = ''
}

async function sendReset() {
  const email = document.getElementById('forgot-email').value.trim()
  const msg   = document.getElementById('forgot-msg')
  if (!email) { showMsg(msg, 'Enter your email address', 'error'); return }
  msg.style.display = 'none'
  try {
    const j = await (await fetch(API+'/api/v1/auth/forgot-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({email})
    })).json()
    if (j.success) {
      showMsg(msg, 'Reset link sent. Check your email (and spam folder).', 'success')
      // DEV: show link in console
      if (j.data._dev_reset_url) console.log('DEV reset URL:', j.data._dev_reset_url)
    } else {
      showMsg(msg, j.error||'Something went wrong', 'error')
    }
  } catch(e) { showMsg(msg, 'Connection error. Try again.', 'error') }
}

async function doReset() {
  const pw  = document.getElementById('new-password').value
  const pw2 = document.getElementById('confirm-password').value
  const msg = document.getElementById('reset-msg')
  if (pw.length < 6) { showMsg(msg, 'Password must be at least 6 characters', 'error'); return }
  if (pw !== pw2)    { showMsg(msg, 'Passwords do not match', 'error'); return }
  try {
    const j = await (await fetch(API+'/api/v1/auth/reset-password', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token, password:pw})
    })).json()
    if (j.success) {
      showMsg(msg, 'Password reset! Redirecting to sign in...', 'success')
      setTimeout(()=>window.location.href='login.html', 2000)
    } else { showMsg(msg, j.error||'Reset failed. Link may have expired.', 'error') }
  } catch(e) { showMsg(msg, 'Connection error. Try again.', 'error') }
}

function showMsg(el, text, type) {
  el.textContent = text; el.className = 'msg '+type; el.style.display = 'block'
}
</script>
</body>
</html>
